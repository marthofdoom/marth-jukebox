name: native

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

# A newer push supersedes an in-flight build. Without this, several ~30 min
# cold builds run in parallel racing to populate the same cache, and none of
# them wins.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # SPLIT restore/save ON PURPOSE. The combined actions/cache action only
      # saves in its post-step when the job SUCCEEDS -- so with a plain cache
      # step, every compile error throws away the vcpkg build and the next run
      # pays the full ~30 min cold cost again. Early development is mostly
      # failed builds, so that is exactly backwards: the cache matters MOST
      # when the build is broken.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Configure
        run: cmake --preset release -DMJ_BUILD_TESTS=ON
        env:
          VCPKG_ROOT: C:\vcpkg

      # Immediately after Configure (which is what actually builds the vcpkg
      # dependencies) and BEFORE the compile that might fail. if: always() so a
      # cancelled or failing job still banks the expensive artifacts.
      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}

      - name: Build
        run: cmake --build build/release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MarthJukebox-dll
          path: |
            native/build/release/MarthJukebox.dll
            native/build/release/MarthJukebox.pdb
            native/build/release/mj_net_tests.exe
          if-no-files-found: error

      # Pure-C++ core tests (native/core.cmake): reconfigure the same tree with the option, build only the
      # test target and run it. Any failing check makes mj_core_tests exit non-zero and fails the job.
      - name: Core tests
        run: |
          cmake --preset release -DMJ_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build/release --target mj_core_tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\build\release\mj_core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          VCPKG_ROOT: C:\vcpkg
      # Settings-page view-model tests (native/menu, built against StubApp.cpp, never the DLL).
      - name: Menu tests
        run: |
          cmake --build build/release --target mj_menu_tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\build\release\mj_menu_tests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          VCPKG_ROOT: C:\vcpkg
      # Network client tests: a console exe with an in-process 127.0.0.1 HTTP server. Never
      # touches a real Harmony. A non-zero exit (any failed check) fails the job.
      - name: Run net tests
        run: .\build\release\mj_net_tests.exe

      # The same tests built with MSVC AddressSanitizer, in a separate build dir. Non-blocking
      # (continue-on-error) until it has proven itself; the result is read from the run log.
      - name: Build net tests (ASan, non-blocking)
        continue-on-error: true
        run: |
          cmake --preset release -B build/asan -DMJ_BUILD_TESTS=ON -DMJ_TESTS_ASAN=ON
          cmake --build build/asan --target mj_net_tests
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Run net tests (ASan, non-blocking)
        continue-on-error: true
        run: .\build\asan\mj_net_tests.exe
